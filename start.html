<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>InaiB</title>
<style>
:root{color-scheme:light dark;--bg:#fff;--fg:#202124;--card:#f1f3f4;--ac:#0b57d0}
@media(prefers-color-scheme:dark){:root{--bg:#202124;--fg:#e8eaed;--card:#2b2c2f;--ac:#8ab4f8}}
body{margin:0;background:var(--bg);color:var(--fg);font-family:sans-serif;text-align:center;padding:12vh 16px 24px}
h1{font-size:44px;margin:0;letter-spacing:1px;color:var(--ac)}
p{margin:6px 0 28px;opacity:.7;font-size:14px}
.g{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-width:420px;margin:0 auto}
a{display:block;text-decoration:none;color:var(--fg);background:var(--card);border-radius:14px;padding:14px 4px;font-size:12px}
a b{display:block;width:36px;height:36px;line-height:36px;margin:0 auto 6px;border-radius:50%;background:var(--ac);color:var(--bg);font-size:16px}
</style>
</head>
<body>
<h1>InaiB</h1>
<p>Fast &middot; Private &middot; Ad-free</p>
<div class="g">
<a href="https://www.google.co.in/"><b>G</b>Google</a>
<a href="https://m.youtube.com/"><b>Y</b>YouTube</a>
<a href="https://en.wikipedia.org/"><b>W</b>Wikipedia</a>
<a href="https://www.irctc.co.in/"><b>I</b>IRCTC</a>
<a href="https://www.flipkart.com/"><b>F</b>Flipkart</a>

<a href="https://www.cricbuzz.com/"><b>C</b>Cricbuzz</a>
<a href="https://www.digilocker.gov.in/"><b>D</b>DigiLocker</a>
</div>
</body>
</html>
